<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470"
     role="img" aria-label="An invoice forwarded by email passes three checks, then joins the same processing pipeline as a manual upload; failed checks create nothing and report the reason.">
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1B9C93"/>
    </marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A7383"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B8433C"/>
    </marker>
  </defs>

  <!-- The figure is a printed sheet: it keeps its own ground so it stays legible
       whatever the surrounding page theme is. -->
  <rect x="0" y="0" width="1120" height="470" rx="10" fill="#F8FAFB"/>
  <rect x="0.6" y="0.6" width="1118.8" height="468.8" rx="10" fill="none" stroke="#DCE5E9" stroke-width="1.2"/>

  <!-- ── Stage 1: the email arrives and is forwarded ─────────────────────── -->
  <rect x="24" y="92" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#DCE5E9" stroke-width="1.25"/>
  <text x="114" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#123243">Invoice arrives</text>
  <text x="114" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#123243">in your inbox</text>
  <text x="114" y="161" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#5A7383">from the supplier</text>

  <line x1="204" y1="135" x2="240" y2="135" stroke="#1B9C93" stroke-width="1.6" marker-end="url(#arrowTeal)"/>

  <rect x="244" y="76" width="212" height="126" rx="8" fill="#FFFFFF" stroke="#1B9C93" stroke-width="1.6"/>
  <text x="350" y="107" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#123243">You forward it to that</text>
  <text x="350" y="125" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#123243">company&#8217;s own address</text>
  <rect x="256" y="134" width="188" height="36" rx="4" fill="#E4F2F1"/>
  <text x="350" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#12716B">acme-corp-7k2m9x</text>
  <text x="350" y="163" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#12716B">@invoice.scantrix.ai</text>
  <text x="350" y="190" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">one address per QuickBooks company</text>

  <line x1="456" y1="135" x2="492" y2="135" stroke="#1B9C93" stroke-width="1.6" marker-end="url(#arrowTeal)"/>

  <!-- ── Stage 2: the three checks ───────────────────────────────────────── -->
  <rect x="496" y="34" width="232" height="202" rx="8" fill="#F1F6F7" stroke="#B9CBD2" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="612" y="56" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.7" fill="#5A7383">SCANTRIX CHECKS, IN ORDER</text>

  <circle cx="522" cy="84" r="10" fill="#123243"/>
  <text x="522" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="542" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#123243">Is this address one we issued?</text>
  <text x="542" y="98" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">Tells us which company&#8217;s books.</text>

  <circle cx="522" cy="134" r="10" fill="#123243"/>
  <text x="522" y="138" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="542" y="132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#123243">Are you allowed to send here?</text>
  <text x="542" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">Verified account, real sender, not</text>
  <text x="542" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">a forged &#8220;From&#8221; line.</text>

  <circle cx="522" cy="192" r="10" fill="#123243"/>
  <text x="522" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="542" y="190" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#123243">Is the file really an invoice?</text>
  <text x="542" y="206" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">Checked by content, not by name.</text>
  <text x="542" y="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">Signature logos skipped.</text>

  <line x1="728" y1="135" x2="768" y2="135" stroke="#1B9C93" stroke-width="1.6" marker-end="url(#arrowTeal)"/>

  <!-- Rejection branch: any check failing ends here, and nothing is created. -->
  <path d="M 612 236 L 612 266 L 532 266 L 532 292" fill="none" stroke="#B8433C" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
  <text x="624" y="258" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-style="italic" fill="#B8433C">if any check fails</text>
  <rect x="366" y="296" width="332" height="62" rx="8" fill="#FBECEB" stroke="#B8433C" stroke-width="1.25"/>
  <text x="532" y="320" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#8E322C">No invoice is created</text>
  <text x="532" y="339" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#8E322C">You get a note saying which file was refused, and why.</text>

  <!-- ── Stage 3: the shared pipeline (the whole point) ──────────────────── -->
  <rect x="772" y="76" width="164" height="118" rx="8" fill="#FFFFFF" stroke="#123243" stroke-width="1.9"/>
  <text x="854" y="103" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#123243">The same</text>
  <text x="854" y="121" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#123243">processing as a</text>
  <text x="854" y="139" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#123243">manual upload</text>
  <text x="854" y="161" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">reading, vendor match,</text>
  <text x="854" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">duplicate check</text>

  <!-- The existing path joins here. Drawn from below so the convergence is the
       thing the eye lands on: nothing about today's workflow changes. -->
  <rect x="756" y="296" width="196" height="62" rx="8" fill="#FFFFFF" stroke="#5A7383" stroke-width="1.25"/>
  <text x="854" y="320" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#123243">You upload in the app</text>
  <text x="854" y="339" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#5A7383">exactly as you do today</text>
  <line x1="854" y1="296" x2="854" y2="198" stroke="#5A7383" stroke-width="1.6" marker-end="url(#arrowInk)"/>
  <text x="864" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-style="italic" fill="#5A7383">unchanged</text>

  <line x1="936" y1="135" x2="972" y2="135" stroke="#123243" stroke-width="1.6" marker-end="url(#arrowInk)"/>

  <!-- ── Stage 4: outcome ────────────────────────────────────────────────── -->
  <rect x="976" y="76" width="126" height="118" rx="8" fill="#FFFFFF" stroke="#DCE5E9" stroke-width="1.25"/>
  <text x="1039" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#123243">Waiting in</text>
  <text x="1039" y="119" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#123243">your review</text>
  <text x="1039" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#123243">list</text>
  <rect x="998" y="148" width="82" height="20" rx="10" fill="#E4F2F1"/>
  <text x="1039" y="162" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#12716B">EMAIL</text>
  <text x="1039" y="184" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5A7383">tagged by source</text>

  <!-- ── Footer: what stays the same, and the legend ─────────────────────── -->
  <line x1="24" y1="392" x2="1096" y2="392" stroke="#DCE5E9" stroke-width="1"/>
  <text x="24" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#123243">From here on, nothing is different: you review the invoice, resolve the vendor, and post to QuickBooks exactly as you do now.</text>

  <line x1="24" y1="440" x2="52" y2="440" stroke="#1B9C93" stroke-width="1.6"/>
  <text x="60" y="444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">new email route</text>
  <line x1="184" y1="440" x2="212" y2="440" stroke="#5A7383" stroke-width="1.6"/>
  <text x="220" y="444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">existing route, unchanged</text>
  <line x1="392" y1="440" x2="420" y2="440" stroke="#B8433C" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="428" y="444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5A7383">refused, nothing created</text>
</svg>
